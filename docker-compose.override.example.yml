# Example local override (copy to docker-compose.override.yml on a dev machine).
# Production installs should not use an override — they pull GHCR images only.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # edit paths, then:
#   docker compose up -d --build

services:
  postgres:
    volumes:
      - "/path/to/database/postgres:/var/lib/postgresql/data"

  redis:
    volumes:
      - "/path/to/redis:/data"

  db-migrate:
    image: dronemedia-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    pull_policy: build
    volumes:
      - app_data:/data/app
      - ./config.yml:/app/config.yml:ro
      - "/path/to/cache:/data/cache"
      - "/path/to/media:/data/media"

  app:
    image: dronemedia-app:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.5}
    pull_policy: build
    volumes:
      - app_data:/data/app
      - ./config.yml:/app/config.yml:ro
      - "/path/to/cache:/data/cache"
      - "/path/to/media:/data/media"

  worker:
    image: dronemedia-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    pull_policy: build
    volumes:
      - app_data:/data/app
      - ./config.yml:/app/config.yml:ro
      - "/path/to/cache:/data/cache"
      - "/path/to/media:/data/media"
