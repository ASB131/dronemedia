<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Drone Media</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: #374151;
        --primary: #8ab4ff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 1.5rem;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.45;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.25rem;
        padding: 0 0.9rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        color: var(--fg);
        text-decoration: none;
        font-size: 0.875rem;
      }
      a:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Drone Media can’t reach the server right now. Check your connection and
        try again.
      </p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
