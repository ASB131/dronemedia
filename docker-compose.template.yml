# Drone Media — template kept in sync with docker-compose.yml (GHCR image pulls).
# Prefer copying docker-compose.yml from the repo for new installs.
#
# Images:
#   ghcr.io/asb131/dronemedia-app:${APP_VERSION:-latest}
#   ghcr.io/asb131/dronemedia-worker:${APP_VERSION:-latest}
#
#   cp .env.example .env
#   # edit paths / AUTH_SECRET / PUBLIC_URL
#   docker compose pull && docker compose up -d

name: dronemedia

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dronemedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drone_media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drone_media}
      POSTGRES_DB: ${POSTGRES_DB:-drone_media}
    volumes:
      - "${UPLOAD_LOCATION_POSTGRES:-./data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_media -d drone_media"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: dronemedia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - "${UPLOAD_LOCATION_REDIS:-./data/redis}:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: ghcr.io/asb131/dronemedia-worker:${APP_VERSION:-latest}
    container_name: dronemedia-db-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_media}:${POSTGRES_PASSWORD:-drone_media}@postgres:5432/${POSTGRES_DB:-drone_media}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-drone_media}
      APP_DATA_PATH: /data/app
      CACHE_PATH: /data/cache
      MEDIA_PATH: /data/media
      CONFIG_PATH: /app/config.yml
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/data/app
      - ${CONFIG_FILE:-./config.yml}:/app/config.yml:ro
      - "${UPLOAD_LOCATION_CACHE:-./data/cache}:/data/cache"
      - "${UPLOAD_LOCATION_MEDIA:-./data/media}:/data/media"
    command: ["sh", "./docker/migrate.sh"]

  app:
    image: ghcr.io/asb131/dronemedia-app:${APP_VERSION:-latest}
    container_name: dronemedia-app
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-3g}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      HOSTNAME: "0.0.0.0"
      PORT: 2283
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3384}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_media}:${POSTGRES_PASSWORD:-drone_media}@postgres:5432/${POSTGRES_DB:-drone_media}
      REDIS_URL: redis://redis:6379
      APP_DATA_PATH: /data/app
      CACHE_PATH: /data/cache
      MEDIA_PATH: /data/media
      CONFIG_PATH: /app/config.yml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-latest}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-latest}
      RUN_MIGRATIONS: "false"
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=2048}
    ports:
      - "${HOST_PORT:-3384}:2283"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - app_data:/data/app
      - ${CONFIG_FILE:-./config.yml}:/app/config.yml:ro
      - "${UPLOAD_LOCATION_CACHE:-./data/cache}:/data/cache"
      - "${UPLOAD_LOCATION_MEDIA:-./data/media}:/data/media"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2283/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: ghcr.io/asb131/dronemedia-worker:${APP_VERSION:-latest}
    container_name: dronemedia-worker
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-drone_media}:${POSTGRES_PASSWORD:-drone_media}@postgres:5432/${POSTGRES_DB:-drone_media}
      REDIS_URL: redis://redis:6379
      APP_DATA_PATH: /data/app
      CACHE_PATH: /data/cache
      MEDIA_PATH: /data/media
      CONFIG_PATH: /app/config.yml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: "false"
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - app_data:/data/app
      - ${CONFIG_FILE:-./config.yml}:/app/config.yml:ro
      - "${UPLOAD_LOCATION_CACHE:-./data/cache}:/data/cache"
      - "${UPLOAD_LOCATION_MEDIA:-./data/media}:/data/media"

volumes:
  app_data:
