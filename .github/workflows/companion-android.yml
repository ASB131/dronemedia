name: Build companion APK

on:
  push:
    branches: [main, develop]
    paths:
      - "companion-android/**"
      - ".github/workflows/companion-android.yml"
      - "src/app/api/companion/**"
      - "src/app/api/upload/**"
      - "src/lib/api/auth.ts"
      - "src/lib/auth/api-keys.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: companion-android
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build release APK
        working-directory: companion-android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dronemedia-companion-apk
          path: companion-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: Drone Media Companion (latest)
          body: |
            Native Android companion for Quick Transfer uploads from `DCIM/DJI Album`.

            Install the APK below, then in the web app create an API key under **Account → Security**.
          files: companion-android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true
